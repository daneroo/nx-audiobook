services:
  audiobookshelf:
    # 2026-10-27 update from 2.37.1 to 2.37.2
    # ...
    # 2023-10-19 update from 2.4.3 to 2.4.4 (epu on mobile fix)
    # 2023-09-21 update from 2.3.3 to 2.4.3
    image: ghcr.io/advplyr/audiobookshelf:2.37.2
    ports:
      - 13378:80
    volumes:
      - ${AUDIOBOOKS_VOLUME:-/Volumes/Space/Reading/audiobooks}:/audiobooks:${AUDIOBOOKS_ACCESS_MODE:-ro}
      - ./data/metadata:/metadata
      - ./data/config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      # Cap logs at 2*2MB total.
      # At ~0.33MB/day, this preserves ~12 days of history.
      options:
        max-size: '2m'
        max-file: '2'
